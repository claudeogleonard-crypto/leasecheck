[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Static site, no build step'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 200

# Security headers for the static pages (function responses set their own).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
